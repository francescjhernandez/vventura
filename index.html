<!DOCTYPE html>
<html lang="ca-valencia">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informador d'IA - CFPA Vicent Ventura</title>
    <style>
        :root {
            --primary-color: #000000;
            --primary-hover: #333333;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #212529;
            --border-color: #e9ecef;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .lang-bar {
            background-color: #ffffff;
            border-bottom: 1px solid var(--border-color);
            padding: 10px 20px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .lang-btn {
            background-color: transparent;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85rem;
            color: var(--text-color);
            transition: all 0.2s ease;
        }

        .lang-btn.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .container {
            max-width: 800px;
            width: 90%;
            margin: 20px auto;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow: hidden;
            padding: 25px;
            text-align: center;
        }

        .header-logo {
            display: block;
            margin: 0 auto 15px auto;
            max-height: 120px;
            object-fit: contain;
        }

        .header-title {
            color: #000;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .header-desc {
            color: #555;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* Xat i contenidor */
        #chat-container {
            display: flex;
            flex-direction: column;
            height: 480px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            text-align: left;
        }

        #chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background: #fafafa;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 80%;
            line-height: 1.4;
            font-size: 14px;
        }

        .message.user {
            background: #000;
            color: #fff;
            align-self: flex-end;
        }

        .message.bot {
            background: #fff;
            border: 1px solid var(--border-color);
            align-self: flex-start;
            color: var(--text-color);
        }

        .message.loading {
            font-style: italic;
            color: #444;
            background: #f0f4f8;
            border: 1px dashed #000;
            align-self: flex-start;
            transition: all 0.3s ease;
        }

        /* Entrada de text i botons */
        .chat-input-area {
            display: flex;
            padding: 10px;
            background: #fff;
            border-top: 1px solid var(--border-color);
            gap: 8px;
            align-items: center;
        }

        .chat-input-area input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
            font-size: 14px;
        }

        .chat-input-area input:disabled {
            background-color: #e9ecef;
            cursor: not-allowed;
        }

        .btn-action {
            background: #000;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            font-size: 14px;
        }

        .btn-action:hover:not(:disabled) {
            background: #333;
        }

        .btn-action:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-mic.recording {
            background: #d9534f;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        footer {
            background-color: #ffffff;
            border-top: 1px solid var(--border-color);
            text-align: center;
            padding: 18px;
            font-size: 0.9rem;
            color: #6c757d;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <div class="container">

        </div>

        <div id="chat-container">
            <div id="chat-messages">
                <div id="welcome-msg" class="message bot">Hola! Sóc l'informador virtual del CFPA Vicent Ventura. En què et puc ajudar?</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="userInput" placeholder="Escriu la teua consulta..." onkeypress="if(event.key === 'Enter') enviarMissatge()">
                <button id="micBtn" class="btn-action btn-mic" onclick="alternarMicrofon()" title="Gravar per veu">🎤</button>
                <button id="sendBtn" class="btn-action" onclick="enviarMissatge()">Enviar</button>
            </div>
        </div>
    </div>

    <footer>
        © CFPA Vicent Ventura

            waitingMsgs: [
                "请稍候，信息员正在查阅文档...",
                "答案马上就好...",

                "正在准备您请求的回答..."
            ]

    function changeLang(lang, event) {
        currentLang = lang;
        const data = translations[lang];

        document.getElementById('header-title').innerText = data.title;
        document.getElementById('header-desc').innerText = data.desc;
        document.getElementById('welcome-msg').innerText = data.welcome;
        document.getElementById('userInput').placeholder = data.placeholder;
        document.getElementById('sendBtn').innerText = data.sendBtn;

        document.getElementById('chat-container').style.direction = data.dir;
        document.getElementById('userInput').style.direction = data.dir;

        document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
        if (event && event.target) {
            event.target.classList.add('active');
        }

        if (reconeixementVeu) {
            const langMap = {
                ca: 'ca-ES', es: 'es-ES', en: 'en-US', fr: 'fr-FR',
                pt: 'pt-PT', it: 'it-IT', ro: 'ro-RO', ar: 'ar-SA',
                uk: 'uk-UA', ru: 'ru-RU', zh: 'zh-CN'
            };
            reconeixementVeu.lang = langMap[lang] || 'ca-ES';
        }
    }

    // Speech Recognition
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        reconeixementVeu = new SpeechRecognition();
        reconeixementVeu.continuous = false;
        reconeixementVeu.interimResults = false;
        reconeixementVeu.lang = 'ca-ES';

        reconeixementVeu.onresult = (event) => {
            const transcripcio = event.results[0][0].transcript;
            document.getElementById('userInput').value = transcripcio;
            aturarGravacio();
        };

        reconeixementVeu.onerror = () => { aturarGravacio(); };
        reconeixementVeu.onend = () => { aturarGravacio(); };
    } else {
        document.getElementById('micBtn').style.display = 'none';
    }

    function alternarMicrofon() {
        if (estatProcessant) return;
        if (gravant) {
            reconeixementVeu.stop();
            aturarGravacio();
        } else {
            try {
                reconeixementVeu.start();
                gravant = true;
                const micBtn = document.getElementById('micBtn');
                micBtn.classList.add('recording');
                micBtn.innerText = '🛑';
            } catch (e) {
                console.error(e);
            }
        }
    }

    function aturarGravacio() {
        gravant = false;
        const micBtn = document.getElementById('micBtn');
        micBtn.classList.remove('recording');
        micBtn.innerText = '🎤';
    }

    function bloquejarEntrada(bloquejar) {
        estatProcessant = bloquejar;
        document.getElementById('userInput').disabled = bloquejar;
        document.getElementById('sendBtn').disabled = bloquejar;
        document.getElementById('micBtn').disabled = bloquejar;
    }

    async function enviarMissatge() {
        if (estatProcessant) return;

        const input = document.getElementById('userInput');
        const missatge = input.value.trim();
        if (!missatge) return;

        const chatMessages = document.getElementById('chat-messages');
        chatMessages.innerHTML += `<div class="message user">${missatge}</div>`;
        input.value = '';
        chatMessages.scrollTop = chatMessages.scrollHeight;

        bloquejarEntrada(true);

        const currentWaitingMsgs = translations[currentLang].waitingMsgs;
        const loadingId = 'loading-' + Date.now();
        let indexMissatge = 0;
        
        chatMessages.innerHTML += `<div id="${loadingId}" class="message bot loading">${currentWaitingMsgs[0]}</div>`;
        chatMessages.scrollTop = chatMessages.scrollHeight;

        intervalRotacio = setInterval(() => {
            indexMissatge = (indexMissatge + 1) % currentWaitingMsgs.length;
            const loadingElem = document.getElementById(loadingId);
            if (loadingElem) {
                loadingElem.innerText = currentWaitingMsgs[indexMissatge];
            }
        }, 2500);

        try {
            const response = await fetch(WORKER_URL, { 
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pregunta: missatge })
            });
            const data = await response.json();
            const respostaBot = data.resposta || data.reply || "No response received.";
            
            clearInterval(intervalRotacio);
            document.getElementById(loadingId).remove();
            chatMessages.innerHTML += `<div class="message bot">${respostaBot}</div>`;
        } catch (err) {
            clearInterval(intervalRotacio);
            document.getElementById(loadingId).remove();
            chatMessages.innerHTML += `<div class="message bot" style="color:red;">Error de connexió.</div>`;
        }

        bloquejarEntrada(false);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        document.getElementById('userInput').focus();
    }
</script>
